<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Martha Wuya Koroma</title>

  <meta
    name="description"
    content="Martha Wuya Koroma — medicine, research, systems and the person behind the work."
  />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --cra: #6da8ff;
      --atrium: #76c995;
      --portfolio: #f0d8b2;
      --ink: #181512;
      --cream: #f6f0e6;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      background: #020305;
      font-family: "Inter", sans-serif;
      color: #fff;
    }

    button,
    a {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    img {
      display: block;
      max-width: 100%;
    }

    /* =========================================================
       INTRO
    ========================================================= */

    #intro {
      position: fixed;
      inset: 0;
      z-index: 100;

      display: grid;
      place-items: center;

      overflow: hidden;

      background:
        radial-gradient(
          circle at 50% 47%,
          rgba(32, 37, 44, 0.52),
          transparent 29%
        ),
        linear-gradient(
          180deg,
          #010204 0%,
          #05070a 60%,
          #020203 100%
        );

      transition:
        opacity 1.5s ease,
        visibility 1.5s ease;
    }

    #intro.done {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .intro-brand {
      position: absolute;
      top: clamp(22px, 4vw, 54px);
      left: clamp(24px, 4vw, 64px);
      z-index: 10;
    }

    .intro-brand h1 {
      margin: 0;

      font-family: "Cormorant Garamond", serif;
      font-size: clamp(28px, 3vw, 48px);
      font-weight: 500;
      line-height: 1;
    }

    .intro-brand p {
      margin: 8px 0 0;

      color: #98a0aa;

      font-size: 9px;
      letter-spacing: 0.27em;
      text-transform: uppercase;
    }

    .skip-intro {
      position: absolute;
      top: clamp(20px, 4vw, 48px);
      right: clamp(20px, 4vw, 54px);

      z-index: 20;

      padding: 10px 16px;

      border: 1px solid rgba(255, 255, 255, 0.26);
      border-radius: 999px;

      background: rgba(5, 7, 10, 0.48);
      color: #f8f5ef;

      backdrop-filter: blur(12px);

      transition:
        background 0.3s ease,
        transform 0.3s ease;
    }

    .skip-intro:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-1px);
    }

    .intro-stage {
      position: absolute;

      left: 50%;
      top: 50%;

      width: min(76vw, 780px);
      aspect-ratio: 1 / 1;

      transform: translate(-50%, -48%);

      perspective: 1600px;
    }

    .head-layer {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: contain;

      opacity: 0;

      transform-origin: center center;
    }

    #headClosed {
      opacity: 1;

      filter:
        brightness(0.12)
        saturate(0.55);

      animation:
        closedHeadEmerge 5s ease-out forwards,
        closedHeadRotate 6.8s ease-in-out 1.2s forwards;
    }

    #headOpen {
      filter: brightness(0.35);

      animation:
        openHeadReveal 2.8s ease-in-out 6.1s forwards;
    }

    #headOpenBrain {
      filter: brightness(0.42);

      animation:
        openBrainReveal 3.1s ease-in-out 8s forwards;
    }

    .intro-halo {
      position: absolute;

      left: 50%;
      top: 49%;

      width: min(42vw, 460px);
      height: min(42vw, 460px);

      transform: translate(-50%, -50%);

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(245, 222, 190, 0.18),
          rgba(110, 168, 255, 0.06) 45%,
          transparent 72%
        );

      filter: blur(18px);

      opacity: 0;

      animation:
        haloReveal 3.5s ease 8.5s forwards;
    }

    .intro-line {
      position: absolute;

      bottom: clamp(28px, 5vh, 62px);
      left: 50%;

      transform: translateX(-50%);

      white-space: nowrap;

      opacity: 0;

      color: rgba(255, 255, 255, 0.72);

      font-family: "Cormorant Garamond", serif;
      font-size: clamp(18px, 2vw, 27px);
      letter-spacing: 0.04em;

      animation:
        introTextReveal 2.5s ease 9.4s forwards;
    }

    @keyframes closedHeadEmerge {
      0% {
        opacity: 0;
        filter:
          brightness(0.025)
          saturate(0.35);
        transform: scale(0.86);
      }

      45% {
        opacity: 0.48;
        filter:
          brightness(0.2)
          saturate(0.6);
      }

      100% {
        opacity: 1;
        filter:
          brightness(0.62)
          saturate(0.86);
        transform: scale(1);
      }
    }

    @keyframes closedHeadRotate {
      0% {
        transform:
          rotateY(-12deg)
          rotateZ(-1deg)
          scale(0.98);
      }

      42% {
        transform:
          rotateY(14deg)
          rotateZ(0.7deg)
          scale(1.01);
      }

      74% {
        transform:
          rotateY(-5deg)
          rotateZ(-0.2deg)
          scale(1.015);
      }

      100% {
        transform:
          rotateY(0deg)
          rotateZ(0deg)
          scale(1.02);
      }
    }

    @keyframes openHeadReveal {
      0% {
        opacity: 0;
        filter: brightness(0.25);
        transform: scale(0.99);
      }

      40% {
        opacity: 0.45;
      }

      100% {
        opacity: 1;
        filter: brightness(0.82);
        transform: scale(1.02);
      }
    }

    @keyframes openBrainReveal {
      0% {
        opacity: 0;
        transform: scale(0.98);
        filter: brightness(0.28);
      }

      45% {
        opacity: 0.7;
      }

      100% {
        opacity: 1;
        transform: scale(1.04);
        filter: brightness(1);
      }
    }

    @keyframes haloReveal {
      to {
        opacity: 1;
        transform:
          translate(-50%, -50%)
          scale(1.28);
      }
    }

    @keyframes introTextReveal {
      to {
        opacity: 1;
        transform:
          translateX(-50%)
          translateY(-4px);
      }
    }

    /* =========================================================
       EXPERIENCE
    ========================================================= */

    #experience {
      position: fixed;
      inset: 0;

      z-index: 1;

      overflow: hidden;

      opacity: 0;
      visibility: hidden;

      color: var(--ink);

      background:
        radial-gradient(
          circle at 68% 48%,
          rgba(86, 72, 54, 0.11),
          transparent 31%
        ),
        linear-gradient(
          135deg,
          #f8f3ea 0%,
          #eee5d8 100%
        );

      transition:
        opacity 1.5s ease,
        visibility 1.5s ease;
    }

    #experience.show {
      opacity: 1;
      visibility: visible;
    }

    .main-brand {
      position: absolute;

      top: clamp(20px, 3.4vw, 50px);
      left: clamp(22px, 4vw, 62px);

      z-index: 30;
    }

    .main-brand h1 {
      margin: 0;

      font-family: "Cormorant Garamond", serif;
      font-size: clamp(24px, 2.3vw, 38px);
      font-weight: 500;
      line-height: 1;
    }

    .main-brand p {
      margin: 7px 0 0;

      color: #7e756b;

      font-size: 9px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
    }

    /* =========================================================
       BRAIN
    ========================================================= */

    .brain-board {
      position: absolute;

      top: 50%;
      right: clamp(-2vw, 2vw, 5vw);

      width: min(61vw, 900px);
      aspect-ratio: 1 / 1;

      transform: translateY(-48%);
    }

    .brain-wrap {
      position: absolute;
      inset: 0;
    }

    .brain-image {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: contain;

      filter:
        drop-shadow(
          0 30px 46px
          rgba(54, 34, 18, 0.13)
        );

      animation:
        brainBreathing 8s
        ease-in-out
        infinite;
    }

    @keyframes brainBreathing {
      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.013);
      }
    }

    /* =========================================================
       ELECTRIC CURRENT
    ========================================================= */

    .brain-current {
      position: absolute;

      inset: 4%;

      width: 92%;
      height: 92%;

      z-index: 7;

      pointer-events: none;

      opacity: 0.8;
    }

    .brain-current path {
      fill: none;

      stroke-width: 1.55;
      stroke-linecap: round;

      stroke-dasharray: 3 17;

      animation:
        currentFlow 8s
        linear
        infinite;
    }

    .cra-line {
      stroke: rgba(92, 150, 255, 0.68);
    }

    .atrium-line {
      stroke: rgba(81, 181, 119, 0.66);
    }

    .portfolio-line {
      stroke: rgba(228, 205, 167, 0.94);
    }

    @keyframes currentFlow {
      to {
        stroke-dashoffset: -220;
      }
    }

    /* =========================================================
       BRAIN REGIONS
    ========================================================= */

    .region {
      position: absolute;

      z-index: 12;

      border: 0;
      border-radius: 50%;

      background: transparent;

      color: currentColor;

      outline: none;
    }

    .region::before {
      content: "";

      position: absolute;
      inset: -30%;

      border-radius: 50%;

      opacity: 0.36;

      filter: blur(28px);

      transition:
        opacity 0.7s ease,
        transform 0.7s ease;
    }

    .region::after {
      content: "";

      position: absolute;
      inset: 15%;

      border: 1px solid currentColor;
      border-radius: 50%;

      opacity: 0.18;

      box-shadow:
        0 0 30px currentColor;

      transition:
        opacity 0.55s ease,
        transform 0.55s ease;
    }

    .region:hover::before,
    .region:focus-visible::before {
      opacity: 0.85;
      transform: scale(1.18);
    }

    .region:hover::after,
    .region:focus-visible::after {
      opacity: 0.62;
      transform: scale(1.08);
    }

    .region-label {
      position: absolute;

      left: 50%;
      top: 50%;

      transform:
        translate(-50%, -50%);

      white-space: nowrap;

      opacity: 0.56;

      font-size: 9px;
      letter-spacing: 0.19em;
      text-transform: uppercase;

      transition:
        opacity 0.4s ease,
        transform 0.4s ease;
    }

    .region:hover .region-label,
    .region:focus-visible .region-label {
      opacity: 1;

      transform:
        translate(-50%, -50%)
        scale(1.05);
    }

    /* CRA = BLUE */

    .region-cra {
      left: 8%;
      top: 22%;

      width: 31%;
      height: 30%;

      color: #528df0;
    }

    .region-cra::before {
      background:
        radial-gradient(
          circle,
          var(--cra),
          transparent 70%
        );
    }

    /* ATRIUM = GREEN */

    .region-atrium {
      left: 37%;
      top: 6%;

      width: 34%;
      height: 32%;

      color: #4aa96d;
    }

    .region-atrium::before {
      background:
        radial-gradient(
          circle,
          var(--atrium),
          transparent 70%
        );
    }

    /* PORTFOLIO = CREAM */

    .region-portfolio {
      left: 58%;
      top: 48%;

      width: 34%;
      height: 31%;

      color: #c7a16a;
    }

    .region-portfolio::before {
      background:
        radial-gradient(
          circle,
          var(--portfolio),
          transparent 70%
        );
    }

    /* =========================================================
       CARTOON MARTHA GUIDE
    ========================================================= */

    .guide-zone {
      position: absolute;

      left: clamp(22px, 4vw, 62px);
      bottom: clamp(28px, 6vh, 74px);

      z-index: 25;

      width: min(33vw, 370px);
      min-width: 260px;
    }

    .guide-image {
      position: relative;

      width: min(18vw, 220px);
      min-width: 150px;

      transform-origin: 50% 95%;

      animation:
        guideIdleFloat 4.6s
        ease-in-out
        infinite;

      transition:
        opacity 0.45s ease,
        transform 0.45s ease;
    }

    .guide-image.talking {
      animation:
        guideTalking 1.1s
        ease-in-out
        infinite;
    }

    @keyframes guideIdleFloat {
      0%,
      100% {
        transform:
          translateY(0)
          rotate(-0.4deg);
      }

      50% {
        transform:
          translateY(-7px)
          rotate(0.5deg);
      }
    }

    @keyframes guideTalking {
      0%,
      100% {
        transform:
          translateY(0)
          scale(1)
          rotate(-0.3deg);
      }

      35% {
        transform:
          translateY(-3px)
          scale(1.012, 0.99)
          rotate(0.25deg);
      }

      70% {
        transform:
          translateY(-1px)
          scale(0.998, 1.012)
          rotate(-0.1deg);
      }
    }

    .speech-bubble {
      position: absolute;

      left: min(16vw, 185px);
      bottom: min(18vw, 205px);

      min-width: 225px;
      max-width: 330px;

      padding: 17px 20px;

      border:
        1px solid
        rgba(48, 40, 34, 0.12);

      border-radius:
        24px
        24px
        24px
        5px;

      background:
        rgba(
          255,
          252,
          247,
          0.92
        );

      box-shadow:
        0 18px 50px
        rgba(66, 48, 31, 0.12);

      backdrop-filter:
        blur(12px);

      font-family:
        "Cormorant Garamond",
        serif;

      font-size:
        clamp(
          20px,
          2vw,
          28px
        );

      font-weight: 500;
      line-height: 1.08;
    }

    .speech-bubble small {
      display: block;

      margin-top: 9px;

      color: #8c7d70;

      font-family: "Inter", sans-serif;
      font-size: 8px;
      font-weight: 500;
      line-height: 1.4;

      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    /* =========================================================
       CARDS
    ========================================================= */

    .card-overlay {
      position: absolute;
      inset: 0;

      z-index: 60;

      display: grid;
      place-items: center;

      opacity: 0;
      visibility: hidden;

      background:
        rgba(
          13,
          12,
          11,
          0.26
        );

      backdrop-filter:
        blur(11px);

      transition:
        opacity 0.55s ease,
        visibility 0.55s ease;
    }

    .card-overlay.open {
      opacity: 1;
      visibility: visible;
    }

    .card {
      width: min(86vw, 860px);

      min-height:
        min(68vh, 620px);

      display: grid;
      grid-template-columns:
        44% 56%;

      overflow: hidden;

      border-radius: 32px;

      background: #fbf7f0;

      box-shadow:
        0 38px 100px
        rgba(30, 20, 14, 0.28);

      transform:
        translateY(24px)
        scale(0.97);

      transition:
        transform
        0.6s
        cubic-bezier(
          0.2,
          0.75,
          0.2,
          1
        );
    }

    .card-overlay.open .card {
      transform: none;
    }

    .card-image-wrap {
      position: relative;

      min-height: 100%;

      background: #ddd;
    }

    .card-image-wrap img {
      width: 100%;
      height: 100%;

      object-fit: cover;
    }

    .card-content {
      display: flex;
      flex-direction: column;
      justify-content: center;

      padding:
        clamp(
          28px,
          5vw,
          64px
        );
    }

    .card-kicker {
      margin:
        0
        0
        14px;

      color: #8b7f73;

      font-size: 9px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    .card-content h2 {
      margin: 0;

      font-family:
        "Cormorant Garamond",
        serif;

      font-size:
        clamp(
          38px,
          5vw,
          68px
        );

      font-weight: 500;
      line-height: 0.92;
    }

    .card-copy {
      margin:
        22px
        0
        0;

      max-width: 39ch;

      color: #514940;

      font-size: 14px;
      line-height: 1.65;
    }

    .card-actions {
      display: flex;
      align-items: center;
      gap: 12px;

      flex-wrap: wrap;

      margin-top: 30px;
    }

    .enter-link {
      display: inline-flex;
      align-items: center;
      gap: 10px;

      padding:
        13px
        17px;

      border-radius: 999px;

      background: #151310;
      color: #fff;

      text-decoration: none;
    }

    .back-button {
      border: 0;

      padding:
        10px
        8px;

      background: transparent;

      color: #6d6258;
    }

    .back-button:hover {
      text-decoration: underline;
    }

    /* =========================================================
       SMALL FOOT LABEL
    ========================================================= */

    .mind-map-label {
      position: absolute;

      right: 26px;
      bottom: 22px;

      z-index: 15;

      color: #9a9085;

      font-size: 8px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 780px) {

      .brain-board {
        width: 94vw;

        right: -19vw;
        top: 45%;
      }

      .main-brand p,
      .intro-brand p {
        font-size: 7px;
      }

      .guide-zone {
        left: 16px;
        bottom: 18px;

        width: 44vw;
        min-width: 180px;
      }

      .guide-image {
        width: 33vw;
        min-width: 128px;
      }

      .speech-bubble {
        left: 25vw;
        bottom: 28vw;

        min-width: 165px;
        max-width: 48vw;

        padding:
          13px
          15px;

        font-size: 18px;
      }

      .speech-bubble small {
        font-size: 7px;
      }

      .card {
        width: min(91vw, 560px);

        max-height: 88vh;

        grid-template-columns: 1fr;

        overflow-y: auto;
      }

      .card-image-wrap {
        height: 42vh;
      }

      .card-content {
        padding: 28px;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation: none !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>

  <!-- =======================================================
       INTRO
  ======================================================== -->

  <section id="intro">

    <div class="intro-brand">
      <h1>Martha Wuya Koroma</h1>

      <p>
        Medicine · Research · Systems · Building
      </p>
    </div>

    <button
      class="skip-intro"
      id="skipIntro"
      type="button"
    >
      Skip intro
    </button>

    <div class="intro-halo"></div>

    <div class="intro-stage">

      <img
        id="headClosed"
        class="head-layer"
        src="head-closed.png"
        alt=""
      />

      <img
        id="headOpen"
        class="head-layer"
        src="head-open.png"
        alt=""
      />

      <img
        id="headOpenBrain"
        class="head-layer"
        src="head-open-brain.png"
        alt=""
      />

    </div>

    <div class="intro-line">
      There is a lot going on in here.
    </div>

  </section>


  <!-- =======================================================
       MAIN EXPERIENCE
  ======================================================== -->

  <main id="experience">

    <header class="main-brand">

      <h1>
        Martha Wuya Koroma
      </h1>

      <p>
        Medicine · Research · Systems · Building
      </p>

    </header>


    <!-- BRAIN -->

    <section
      class="brain-board"
      aria-label="Choose your Martha"
    >

      <div class="brain-wrap">

        <img
          class="brain-image"
          src="brain-side.png"
          alt="Interactive illustrated brain"
        />


        <!-- coded currents -->

        <svg
          class="brain-current"
          viewBox="0 0 1000 1000"
          aria-hidden="true"
        >

          <path
            class="cra-line"
            d="
              M95,420
              C190,320
              250,290
              370,330
              C470,365
              480,450
              590,440
            "
          />

          <path
            class="atrium-line"
            d="
              M240,160
              C340,115
              470,130
              545,230
              C620,325
              690,330
              755,300
            "
          />

          <path
            class="portfolio-line"
            d="
              M510,570
              C610,545
              710,605
              785,700
              C835,765
              860,770
              920,735
            "
          />

        </svg>


        <!-- CRA -->

        <button
          class="region region-cra"
          data-state="cra"
          aria-label="Open CRA Portfolio"
        >
          <span class="region-label">
            CRA
          </span>
        </button>


        <!-- ATRIUM -->

        <button
          class="region region-atrium"
          data-state="atrium"
          aria-label="Open Atrium"
        >
          <span class="region-label">
            Atrium
          </span>
        </button>


        <!-- PORTFOLIO -->

        <button
          class="region region-portfolio"
          data-state="portfolio"
          aria-label="Open Personal Portfolio"
        >
          <span class="region-label">
            Portfolio
          </span>
        </button>

      </div>

    </section>


    <!-- CARTOON MARTHA -->

    <aside
      class="guide-zone"
      aria-live="polite"
    >

      <img
        class="guide-image talking"
        id="guideImage"
        src="welcome-martha.png"
        alt="Cartoon Martha"
      />

      <div class="speech-bubble">

        <span id="bubbleText">
          Choose your Martha
        </span>

        <small>
          Tap a glowing part of the brain
        </small>

      </div>

    </aside>


    <div class="mind-map-label">
      Interactive mind map
    </div>


    <!-- ===================================================
         POPUP CARD
    ==================================================== -->

    <div
      class="card-overlay"
      id="cardOverlay"
      role="dialog"
      aria-modal="true"
      aria-hidden="true"
    >

      <article class="card">

        <div class="card-image-wrap">

          <img
            id="cardImage"
            src=""
            alt=""
          />

        </div>


        <div class="card-content">

          <p
            class="card-kicker"
            id="cardKicker"
          ></p>

          <h2
            id="cardTitle"
          ></h2>

          <p
            class="card-copy"
            id="cardCopy"
          ></p>

          <div class="card-actions">

            <a
              class="enter-link"
              id="cardLink"
              href="#"
            >
              Enter →
            </a>

            <button
              class="back-button"
              id="closeCard"
              type="button"
            >
              Back to the brain
            </button>

          </div>

        </div>

      </article>

    </div>

  </main>


  <script>

    /* ======================================================
       INTRO
    ====================================================== */

    const intro =
      document.getElementById("intro");

    const experience =
      document.getElementById("experience");

    const skipIntro =
      document.getElementById("skipIntro");


    function enterExperience() {

      intro.classList.add("done");

      experience.classList.add("show");

    }


    skipIntro.addEventListener(
      "click",
      enterExperience
    );


    /* slow intro:
       approximately 13 seconds
    */

    setTimeout(
      enterExperience,
      13000
    );


    /* ======================================================
       CARD DATA
    ====================================================== */

    const states = {

      cra: {

        title:
          "CRA Portfolio",

        kicker:
          "Clinical Research · Evidence · Systems",

        image:
          "cra-martha.png",

        copy:
          "Where I show exactly where and how medicine, research, style and business interact — systems thinking in real time.",

        link:
          "https://cra.marthakoroma.com"

      },


      atrium: {

        title:
          "Atrium",

        kicker:
          "Fashion · Reading · Cozy Salon",

        image:
          "atrium-martha.png",

        copy:
          "Fashion, reading and a cozy salon just for existing all live here.",

        link:
          "https://atrium.marthakoroma.com"

      },


      portfolio: {

        title:
          "Personal Portfolio",

        kicker:
          "The Path · The Work · The Person",

        image:
          "portfolio-martha.png",

        copy:
          "From high school, uni, first job till now — all in one place.",

        link:
          "https://portfolio.marthakoroma.com"

      }

    };


    /* ======================================================
       POPUP CARD
    ====================================================== */

    const cardOverlay =
      document.getElementById(
        "cardOverlay"
      );

    const cardImage =
      document.getElementById(
        "cardImage"
      );

    const cardTitle =
      document.getElementById(
        "cardTitle"
      );

    const cardKicker =
      document.getElementById(
        "cardKicker"
      );

    const cardCopy =
      document.getElementById(
        "cardCopy"
      );

    const cardLink =
      document.getElementById(
        "cardLink"
      );

    const closeCard =
      document.getElementById(
        "closeCard"
      );


    document
      .querySelectorAll(".region")
      .forEach((button) => {

        button.addEventListener(
          "click",
          () => {

            const state =
              states[
                button.dataset.state
              ];

            cardImage.src =
              state.image;

            cardImage.alt =
              state.title;

            cardTitle.textContent =
              state.title;

            cardKicker.textContent =
              state.kicker;

            cardCopy.textContent =
              state.copy;

            cardLink.href =
              state.link;

            cardLink.textContent =
              "Enter " +
              state.title +
              " →";

            cardOverlay
              .classList
              .add("open");

            cardOverlay
              .setAttribute(
                "aria-hidden",
                "false"
              );

            resetIdle();

          }
        );

      });


    function closeModal() {

      cardOverlay
        .classList
        .remove("open");

      cardOverlay
        .setAttribute(
          "aria-hidden",
          "true"
        );

      resetIdle();

    }


    closeCard.addEventListener(
      "click",
      closeModal
    );


    cardOverlay.addEventListener(
      "click",
      (event) => {

        if (
          event.target ===
          cardOverlay
        ) {

          closeModal();

        }

      }
    );


    document.addEventListener(
      "keydown",
      (event) => {

        if (
          event.key === "Escape"
        ) {

          closeModal();

        }

      }
    );


    /* ======================================================
       CARTOON MARTHA
       IDLE LOOP
    ====================================================== */

    const guideImage =
      document.getElementById(
        "guideImage"
      );

    const bubbleText =
      document.getElementById(
        "bubbleText"
      );


    let idleTimer;

    let idleLoop;

    let idleIndex = 0;


    const idleStates = [

      {
        image:
          "thinking-martha.png",

        text:
          "Hmm..."
      },


      {
        image:
          "frustrated-martha.png",

        text:
          "Wahala o. God abeg."
      },


      {
        image:
          "sleep-martha.png",

        text:
          "body no be firewood"
      },


      {
        image:
          "welcome-martha.png",

        text:
          "Choose your Martha"
      }

    ];


    function setGuide(state) {

      guideImage.style.opacity =
        "0";

      guideImage.style.transform =
        "translateY(7px) scale(.985)";


      setTimeout(
        () => {

          guideImage.src =
            state.image;

          bubbleText.textContent =
            state.text;

          guideImage.style.opacity =
            "1";

          guideImage.style.transform =
            "";

          if (
            state.image ===
            "sleep-martha.png"
          ) {

            guideImage
              .classList
              .remove("talking");

          }

          else {

            guideImage
              .classList
              .add("talking");

          }

        },
        320
      );

    }


    function beginIdleLoop() {

      clearInterval(idleLoop);

      idleIndex = 0;

      setGuide(
        idleStates[idleIndex]
      );


      idleLoop =
        setInterval(
          () => {

            idleIndex =
              (
                idleIndex + 1
              )
              %
              idleStates.length;

            setGuide(
              idleStates[
                idleIndex
              ]
            );

          },
          10000
        );

    }


    function resetIdle() {

      clearTimeout(
        idleTimer
      );

      clearInterval(
        idleLoop
      );


      if (
        !cardOverlay
          .classList
          .contains("open")
      ) {

        setGuide({

          image:
            "welcome-martha.png",

          text:
            "Choose your Martha"

        });


        idleTimer =
          setTimeout(
            beginIdleLoop,
            30000
          );

      }

    }


    [
      "pointerdown",
      "mousemove",
      "keydown",
      "touchstart"
    ].forEach(
      (eventName) => {

        window.addEventListener(
          eventName,
          resetIdle,
          {
            passive: true
          }
        );

      }
    );


    resetIdle();


    /* ======================================================
       NO PAGE SCROLLING
    ====================================================== */

    window.addEventListener(
      "wheel",
      (event) => {

        event.preventDefault();

      },
      {
        passive: false
      }
    );


    window.addEventListener(
      "touchmove",
      (event) => {

        event.preventDefault();

      },
      {
        passive: false
      }
    );

  </script>

</body>
</html>
